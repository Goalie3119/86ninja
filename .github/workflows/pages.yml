# Publishes the site to GitHub Pages on every push to main.
# It also writes images/gallery/gallery.json, the list of gallery photos the page reads,
# so adding a photo to images/gallery/ is all it takes to put it on the site.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: List gallery photos
        run: |
          cd images/gallery
          ls -1 | grep -iE '\.(jpe?g|png|webp|gif|avif)$' | jq -R . | jq -s . > gallery.json || echo "[]" > gallery.json
          cat gallery.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
